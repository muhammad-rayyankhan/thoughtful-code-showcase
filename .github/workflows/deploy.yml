name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: @lovable.dev/vite-tanstack-config's peer range on the pinned
      # nitro beta (a prerelease) doesn't satisfy npm's strict prerelease matching even
      # though the installed version is newer; `npm install` only warns about this, but
      # `npm ci` errors unless told to ignore it.
      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
